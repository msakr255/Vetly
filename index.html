<!DOCTYPE html>
<html lang="en">
<head>
        <!-- ===== Dark Mode: تطبيق الثيم قبل رسم الصفحة (من غير فلاش أبيض) ===== -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('vetly_theme');
                if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>
    <link rel="stylesheet" href="css/dark-mode.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetly - QA Workbench</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%237c3aed'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='40' height='40' rx='10' fill='url(%23g)'/%3E%3Ccircle cx='19' cy='19' r='9' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M14.5 19.5l3.2 3.2 6-6.4' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M25.5 25.5L31 31' stroke='white' stroke-width='3.4' stroke-linecap='round'/%3E%3C/svg%3E">
